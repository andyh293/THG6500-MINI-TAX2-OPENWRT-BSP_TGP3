name: Build OpenWrt for BPI-WiFi6 Mini

on:
  workflow_dispatch: # Allows you to manually trigger the build whenever you want

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Install Compilation Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file libelf-dev ecj fastjar java-propose-classpath subversion time

    - name: Update and Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Default Configuration
      run: |
        # Generates a default config. This builds the basic vendor packages.
        # If you have a custom saved .config file, you can upload/paste it here instead.
        make defconfig

    - name: Compile Host Tools
      run: |
        make tools/compile -j$(nproc) || make tools/compile -j1 V=s

    - name: Compile Toolchain
      run: |
        make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s

    - name: Build Firmware Target
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload Flashable Firmware Binaries
      uses: actions/upload-artifact@v4
      with:
        name: BPI-WiFi6-Mini-OpenWrt-Images
        path: bin/targets/
